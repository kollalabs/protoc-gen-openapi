syntax = "proto3";

package tests.customresponses.message.v1;

import "google/api/annotations.proto";
import "openapi/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/customresponses/message/v1;message";

// Applies to every operation in the file; 401 has no body.
option (openapi.file_params) = {
    custom_responses: {
        key: "401"
        value: {}
    }
};

service Messaging {
    option (openapi.service_params) = {
        custom_responses: {
            key: "403"
            value: {
                description: "Forbidden"
                message_ref: "tests.customresponses.message.v1.ErrorResponse"
            }
        }
        custom_responses: {
            key: "default"
            value: {
                description: "Rest of the errors"
                message_ref: "tests.customresponses.message.v1.ErrorResponse"
            }
        }
    };

    rpc UpdateMessage(Message) returns(Message) {
        option (google.api.http) = {
            patch: "/v1/messages/{message_id}"
            body: "text"
        };
    }

    // The method's 403 replaces the service's.
    rpc DeleteMessage(Message) returns(Message) {
        option (google.api.http) = {
            delete: "/v1/messages/{message_id}"
        };
        option (openapi.method_params) = {
            custom_responses: {
                key: "403"
                value: {
                    description: "Only the author can delete a message"
                    message_ref: ".tests.customresponses.message.v1.ErrorResponse"
                }
            }
        };
    }

    // Tagged method params are left out unless the build tag matches.
    rpc ArchiveMessage(Message) returns(Message) {
        option (google.api.http) = {
            post: "/v1/messages/{message_id}:archive"
            body: "*"
        };
        option (openapi.method_params) = {
            build_tags: ["internal"]
            headers: [{ name: "X-Internal" }]
            custom_responses: {
                key: "409"
                value: {}
            }
        };
    }
}

// Responses gated by build_tags are left out unless the build tag matches.
service Admin {
    option (openapi.service_params) = {
        build_tags: ["internal"]
        custom_responses: {
            key: "500"
            value: {
                message_ref: "tests.customresponses.message.v1.ErrorResponse"
            }
        }
    };

    rpc PurgeMessages(Message) returns(Message) {
        option (google.api.http) = {
            post: "/v1/messages:purge"
            body: "*"
        };
    }
}

message Message {
    string message_id = 1;
    string text = 2;
}

message ErrorResponse {
    string error = 1;
}
