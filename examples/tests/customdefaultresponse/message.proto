syntax = "proto3";

package tests.customdefaultresponse.message.v1;

import "google/api/annotations.proto";
import "openapi/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/customdefaultresponse/message/v1;message";

// Replaces the google.rpc.Status default everywhere, so its schemas must not be emitted.
option (openapi.file_params) = {
    custom_responses: {
        key: "default"
        value: {
            description: "Error"
            message_ref: "tests.customdefaultresponse.message.v1.ErrorResponse"
        }
    }
};

service Messaging {
    rpc GetMessage(Message) returns(Message) {
        option (google.api.http) = {
            get: "/v1/messages/{message_id}"
        };
    }
}

message Message {
    string message_id = 1;
}

message ErrorResponse {
    string error = 1;
}
