syntax = "proto3";

package tests.bodymappying.message.v1;

import "google/api/annotations.proto";
import "envoy/validate.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/bodymapping/message/v1;message";

service Messaging {
    // Update Message Summary | This function updates a message.
    rpc UpdateMessage(Message) returns(Message) {
        option(google.api.http) = {
            patch: "/v1/messages/{message_id}"
            body: "text"
        };
    }
}
message Message {
    string message_id = 1;
    string text = 2 [
    (validate.rules)= {
        string: {
            uri:true, 
            max_len:45,
            min_len:1
        }
    }];

    int64 mynum = 3 [(validate.rules).int64 = {gte:1, lte:30}];

    repeated string patterns = 4 [
        (validate.rules).repeated = {
          ignore_empty: true,
          min_items: 1,
          max_items: 100,
          items: {
            string: {pattern: "^patterns/[a-z0-9]{26}$"}
          }
        }
    ];

    // enum options approval state
    enum ApprovalState {
      // Default
      APPROVAL_STATE_UNSPECIFIED = 0;
      // Pending
      PENDING_APPROVAL = 1;
      // Approved
      APPROVED = 2;
      // rejected
      REJECTED = 3;
    }

    // explicitly include the zero value
    ApprovalState approval_state = 5 [
      (validate.rules).enum = {in: [ 0, 2, 3 ]}
    ];

    // enum with numbers that differ from their declaration index
    enum Priority {
      PRIORITY_UNSPECIFIED = 0;
      LOW = 10;
      HIGH = 20;
      URGENT = 30;
    }

    Priority in_priority = 6 [(validate.rules).enum = {in: [ 10, 30 ]}];
    Priority not_in_priority = 7 [(validate.rules).enum = {not_in: [ 0, 20 ]}];
    Priority const_priority = 8 [(validate.rules).enum = {const: 20}];

    sint32 offset = 10 [(validate.rules).sint32 = {gt: -5, lt: 5}];
    uint32 percent = 11 [(validate.rules).uint32 = {gte: 0, lte: 100}];
    double ratio = 12 [(validate.rules).double = {gt: 0, lte: 1.5}];
    float step = 13 [(validate.rules).float = {const: 0.1}];
    int32 negative = 14 [(validate.rules).int32 = {gte: -10, lte: -1}];
    // outside the range (below 5 or above 10), which minimum/maximum can't express
    int32 outside = 15 [(validate.rules).int32 = {gt: 10, lt: 5}];

    repeated Attachment attachments = 9 [
      (validate.rules).repeated = {
        min_items: 1,
        items: {message: {required: true}}
      }
    ];
}

message Attachment {
    string url = 1;
}
