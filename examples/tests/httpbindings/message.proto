syntax = "proto3";

package tests.httpbindings.message.v1;

import "google/api/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/httpbindings/message/v1;message";

service Messaging {
  // Each additional binding becomes its own operation with a numbered operation ID.
  rpc GetMessage(GetMessageRequest) returns (Message) {
    option (google.api.http) = {
      get : "/v1/messages/{message_id}"
      additional_bindings {
        get : "/v1/users/{user_id}/messages/{message_id}"
      }
      additional_bindings {
        post : "/v1/messages:lookup"
        body : "*"
      }
    };
  }

  // Custom HEAD maps onto the path item's head operation.
  rpc CheckMessage(GetMessageRequest) returns (Message) {
    option (google.api.http) = {
      custom : {
        kind : "HEAD"
        path : "/v1/messages/{message_id}"
      }
    };
  }

  // Custom methods OpenAPI can't represent are skipped with a warning.
  rpc LockMessage(GetMessageRequest) returns (Message) {
    option (google.api.http) = {
      custom : {
        kind : "LOCK"
        path : "/v1/messages/{message_id}"
      }
    };
  }
}

message GetMessageRequest {
  string message_id = 1;
  string user_id = 2;
}

message Message {
  string message_id = 1;
  string content = 2;
}
