syntax = "proto3";

package tests.siblingqueryparams.message.v1;

import "google/api/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/siblingqueryparams/message/v1;message";

service Search {
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse) {
    option (google.api.http) = {
      get : "/v1/places"
    };
  }
}

// Every sibling of the same type must expand to query params,
// regardless of the circular depth limit.
message SearchPlacesRequest {
  Filter filter = 1;
  Expression expression = 2;
}

message Filter {
  Address home = 1;
  Address work = 2;
  Address billing = 3;
}

message Address {
  string city = 1;
}

message SearchPlacesResponse {
  repeated string names = 1;
}

// Many self-references must not expand exponentially.
message Expression {
  Expression a = 1;
  Expression b = 2;
  Expression c = 3;
  Expression d = 4;
  Expression e = 5;
  Expression f = 6;
  string value = 7;
}
